<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Results</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #e0eafc; padding: 50px; text-align: center; }
        .result-card { background: white; padding: 30px; border-radius: 20px; display: inline-block; text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,0.1); min-width: 400px; }
        .weather-info { background: #0052cc; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        li { margin: 10px 0; padding: 5px; list-style: none; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="result-card">
        <div class="weather-info">
            <h2>{{ weather.temp }}°C</h2>
            <p>{{ weather.desc }}</p>
        </div>
        <h3>Your To-Do List:</h3>
        <ul>
            {% for task in tasks %}
                <li><i class="fa-solid fa-location-dot"></i> {{ task }}</li>
            {% endfor %}
        </ul>
        <br>
        <a href="/">← Change Preferences</a>
    </div>
</body>
</html>
