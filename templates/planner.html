<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <title>MunichGo - Smart City Planner</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; padding: 40px 0; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; }
        .logo-area {
    background-color: #0052cc; padding: 25px;text-align: center;color: white; 
}
        h1 { color: #e1e2e5; margin: 0; font-size: 32px; letter-spacing: -1px; }
        .slogan { color: #777; font-style: italic; font-size: 14px; margin-top: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #ffae00; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #0041a3; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-area">
            <h1>🥨MunichtoGo🥨</h1>
            <div class="slogan">All in one...</div>
            
        </div>
        <form action="/generate" method="POST">
            <div class="form-group">
                <label>Group Size:</label>
                <input type="number" name="group_size" value="1" min="1">
            </div>
            <div class="form-group"><label>Traveling with kids?👶👨‍👩‍👧</label>
                <select name="has_child"><option value="no">No</option><option value="yes">Yes</option></select>
            </div>
            <div class="form-group"><label>Anyone with a disability♿?</label>
                <select name="has_disability"><option value="no">No</option><option value="yes">Yes</option></select>
            </div>
            <div class="form-group"><label>Bringing a dog? 🐕</label>
                <select name="has_dog"><option value="no">No</option><option value="yes">Yes</option></select>
            </div>
            <div class="form-group"><label>Do you have a car? 🚗</label>
                <select name="has_car"><option value="no">No</option><option value="yes">Yes</option></select>
            </div>
            <button type="submit">Create My To-do List</button>
        </form>
    </div>
</body>
</html>
